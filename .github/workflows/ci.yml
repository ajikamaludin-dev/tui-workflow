name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y xclip xvfb
      - run: go vet ./...
      - run: xvfb-run -a go test -race ./...
      - run: go build ./...
